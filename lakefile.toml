name = "LeanBridge"
defaultTargets = ["LeanBridge"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.34.0-rc2"

[[require]]
name = "IdealArithmetic"
git = "https://github.com/CBirkbeck/CertifyingInvariantsNF.git"
rev = "galois-v431-bump"

# Keep `require mathlib` last so that Mathlib's pins of its own dependencies take precedence.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "dc4b8d60d5edb3c493c3662126b1b7ccae7d67cf"

[[lean_lib]]
name = "LeanBridge"
