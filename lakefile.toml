name = "LeanBridge"
defaultTargets = ["LeanBridge"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.35.0"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "1f9b4414105d86e487a4ac4c3d3397076a44d0d2"

# Tau Ceti builds with `warningAsError`, so mathlib must be pinned to exactly the commit in Tau Ceti's
# `lake-manifest.json` (and `lean-toolchain` must match Tau Ceti's): bump all three together.
# Keep `require mathlib` last so that Mathlib's pins of its own dependencies take precedence.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "074063781836922cb02701cd12943c9f51731afa"

[[lean_lib]]
name = "LeanBridge"
