name = "LeanBridge"
defaultTargets = ["LeanBridge"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.31.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[require]]
name = "IdealArithmetic"
git = "https://github.com/CBirkbeck/CertifyingInvariantsNF.git"
rev = "galois-v431-bump"

[[lean_lib]]
name = "LeanBridge"
